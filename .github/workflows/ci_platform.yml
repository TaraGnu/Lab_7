name: Ci-multiplatform

on:
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }} (${{ matrix.configuration }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest]
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: build ${{matrix.configuration}}
        run: dotnet build --configuration ${{ matrix.configuration }}
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}-${{ matrix.configuration }}
          path: |
            **/bin/${{ matrix.configuration }}/
            **/obj/${{ matrix.configuration }}/
  test:
    name: Test on ${{ matrix.os }} (${{ matrix.configuration }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest]
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x' 
      - name: Run Test ${{ matrix.configuration }}
        run: >
          dotnet test CalcLib.Tests/CalcLib.Tests.csproj
          --configuration ${{matrix.configuration}}
